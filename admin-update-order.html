<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обновление статуса заказа - Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Обновление статуса заказа</h1>
        
        <div class="form-group">
            <label for="orderId">ID заказа:</label>
            <input type="text" id="orderId" placeholder="b250812a-efce-4e5c-8a0a-2639eec1af37">
        </div>
        
        <div class="form-group">
            <label for="newStatus">Новый статус:</label>
            <select id="newStatus">
                <option value="paid">paid - Оплачен</option>
                <option value="completed">completed - Завершен</option>
                <option value="failed">failed - Неудачный</option>
                <option value="cancelled">cancelled - Отменен</option>
            </select>
        </div>
        
        <button onclick="updateOrderStatus()">Обновить статус</button>
        <button onclick="getOrderInfo()">Получить информацию о заказе</button>
        
        <div id="result"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://wiwkergsvbgnrdslqkzg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd2tlcmdzdmJnbnJkc2xxa3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY5OTA5MjAsImV4cCI6MjA3MjU2NjkyMH0.PmWeSrWMRzlHlFJpwRjlSla3Ra6hWAoCNErMEdEWtEk';
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function showResult(message, type = 'info') {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
        }
        
        async function getOrderInfo() {
            const orderId = document.getElementById('orderId').value.trim();
            
            if (!orderId) {
                showResult('Введите ID заказа', 'error');
                return;
            }
            
            try {
                const { data: order, error } = await supabase
                    .from('orders')
                    .select('*, esim_plans(name, data_gb)')
                    .eq('id', orderId)
                    .single();
                
                if (error) {
                    showResult(`Ошибка получения заказа: ${error.message}`, 'error');
                    return;
                }
                
                if (!order) {
                    showResult('Заказ не найден', 'error');
                    return;
                }
                
                const orderInfo = `
                    <h3>Информация о заказе:</h3>
                    <p><strong>ID:</strong> ${order.id}</p>
                    <p><strong>Статус:</strong> ${order.status}</p>
                    <p><strong>Тариф:</strong> ${order.esim_plans.name} - ${order.esim_plans.data_gb} ГБ</p>
                    <p><strong>Email:</strong> ${order.customer_email}</p>
                    <p><strong>Телефон:</strong> ${order.customer_phone || 'Не указан'}</p>
                    <p><strong>Сумма:</strong> ${order.amount} ₽</p>
                    <p><strong>Создан:</strong> ${new Date(order.created_at).toLocaleString()}</p>
                    <p><strong>QR-код ID:</strong> ${order.qr_code_id || 'Не назначен'}</p>
                `;
                
                showResult(orderInfo, 'info');
                
            } catch (err) {
                showResult(`Критическая ошибка: ${err.message}`, 'error');
            }
        }
        
        async function updateOrderStatus() {
            const orderId = document.getElementById('orderId').value.trim();
            const newStatus = document.getElementById('newStatus').value;
            
            if (!orderId) {
                showResult('Введите ID заказа', 'error');
                return;
            }
            
            try {
                const { error } = await supabase
                    .from('orders')
                    .update({ status: newStatus })
                    .eq('id', orderId);
                
                if (error) {
                    showResult(`Ошибка обновления: ${error.message}`, 'error');
                    return;
                }
                
                showResult(`Статус заказа ${orderId} успешно обновлен на "${newStatus}"`, 'success');
                
                // Автоматически получаем обновленную информацию
                setTimeout(() => getOrderInfo(), 1000);
                
            } catch (err) {
                showResult(`Критическая ошибка: ${err.message}`, 'error');
            }
        }
        
        // Автоматически заполняем ID заказа из URL
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('order');
            if (orderId) {
                document.getElementById('orderId').value = orderId;
            }
        });
    </script>
</body>
</html>
