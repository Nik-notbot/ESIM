[build]
  command = "cd blog-src && npm install && npx tsx scripts/generate-posts-json.ts && npx vite build && rm -rf ../blog && cp -r dist ../blog"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/index.html"
  status = 200
