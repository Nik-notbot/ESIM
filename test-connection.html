<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест подключения к Supabase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Диагностика подключения к Supabase</h1>
    
    <div class="test">
        <h2>1. Прямой тест API</h2>
        <button onclick="testDirectAPI()">Тест прямого API запроса</button>
        <div id="directResult"></div>
    </div>
    
    <div class="test">
        <h2>2. Тест через fetch</h2>
        <button onclick="testFetch()">Тест через fetch</button>
        <div id="fetchResult"></div>
    </div>
    
    <div class="test">
        <h2>3. Тест альтернативного подключения</h2>
        <button onclick="testAlternative()">Тест альтернативы</button>
        <div id="altResult"></div>
    </div>
    
    <div class="test">
        <h2>4. Проверка DNS и сети</h2>
        <button onclick="testNetwork()">Проверить сеть</button>
        <div id="networkResult"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nwcleyhnbzxetcqtlim.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53Y2xleWhubmJ6eGV0Y3F0bGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDczODEzODUsImV4cCI6MjA2Mjk1NzM4NX0.3ss3IMHLlhipHY1u8610mCX6TBG4e3doZULjvoQ1Ijg';
        
        async function testDirectAPI() {
            const result = document.getElementById('directResult');
            result.innerHTML = '<p>Тестируем...</p>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                result.innerHTML = `
                    <p class="${response.ok ? 'success' : 'error'}">
                        Статус: ${response.status} ${response.statusText}
                    </p>
                    <p>Headers:</p>
                    <pre>${JSON.stringify(Object.fromEntries(response.headers), null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">Ошибка: ${error.message}</p>`;
                console.error('Direct API error:', error);
            }
        }
        
        async function testFetch() {
            const result = document.getElementById('fetchResult');
            result.innerHTML = '<p>Тестируем...</p>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/esim_plans?select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                result.innerHTML = `
                    <p class="success">✓ Успешно получены данные</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                result.innerHTML = `<p class="error">Ошибка: ${error.message}</p>`;
                console.error('Fetch error:', error);
            }
        }
        
        async function testAlternative() {
            const result = document.getElementById('altResult');
            result.innerHTML = '<p>Пробуем альтернативные методы...</p>';
            
            // Тест 1: Использование прокси
            try {
                // Можно попробовать через CORS прокси для теста
                const proxyUrl = 'https://corsproxy.io/?';
                const targetUrl = encodeURIComponent(`${SUPABASE_URL}/rest/v1/`);
                
                const response = await fetch(proxyUrl + targetUrl, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY
                    }
                });
                
                result.innerHTML += `<p>Через прокси: ${response.ok ? '✓ Работает' : '✗ Не работает'}</p>`;
            } catch (error) {
                result.innerHTML += `<p class="error">Прокси: ${error.message}</p>`;
            }
            
            // Тест 2: XMLHttpRequest
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', `${SUPABASE_URL}/rest/v1/`, true);
                xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
                
                xhr.onload = function() {
                    result.innerHTML += `<p>XMLHttpRequest: ${xhr.status === 200 ? '✓ Работает' : '✗ Не работает'}</p>`;
                };
                
                xhr.onerror = function() {
                    result.innerHTML += `<p class="error">XMLHttpRequest: Ошибка сети</p>`;
                };
                
                xhr.send();
            } catch (error) {
                result.innerHTML += `<p class="error">XMLHttpRequest: ${error.message}</p>`;
            }
        }
        
        async function testNetwork() {
            const result = document.getElementById('networkResult');
            result.innerHTML = '<p>Проверяем сетевые настройки...</p>';
            
            // Проверка других API для сравнения
            const tests = [
                { name: 'GitHub API', url: 'https://api.github.com' },
                { name: 'JSONPlaceholder', url: 'https://jsonplaceholder.typicode.com/posts/1' },
                { name: 'Supabase главная', url: 'https://supabase.com' }
            ];
            
            for (const test of tests) {
                try {
                    const start = Date.now();
                    const response = await fetch(test.url);
                    const time = Date.now() - start;
                    
                    result.innerHTML += `
                        <p class="${response.ok ? 'success' : 'error'}">
                            ${test.name}: ${response.ok ? '✓' : '✗'} (${time}ms)
                        </p>
                    `;
                } catch (error) {
                    result.innerHTML += `<p class="error">${test.name}: ✗ ${error.message}</p>`;
                }
            }
            
            // Информация о браузере
            result.innerHTML += `
                <h3>Информация о браузере:</h3>
                <pre>${navigator.userAgent}</pre>
                <p>Протокол: ${window.location.protocol}</p>
                <p>Хост: ${window.location.host}</p>
            `;
        }
    </script>
</body>
</html>
