<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Wata API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Тест Wata API</h1>
    
    <div class="test">
        <h2>Проверка API ключа</h2>
        <button onclick="testWataAPI()">Тестировать Wata API</button>
        <div id="wataResult"></div>
    </div>
    
    <div class="test">
        <h2>Создание тестового платежа</h2>
        <button onclick="createTestPayment()">Создать тестовый платеж</button>
        <div id="paymentResult"></div>
    </div>

    <script>
        const WATA_API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJQdWJsaWNJZCI6IjNhMWJmOTYxLThjYmMtYmIwZC1iMmRjLTNmMTQ1YjVmYjdlOCIsIlRva2VuVmVyc2lvbiI6IjIiLCJleHAiOjE3NTk1Njk0NjcsImlzcyI6Imh0dHBzOi8vYXBpLndhdGEucHJvIiwiYXVkIjoiaHR0cHM6Ly9hcGkud2F0YS5wcm8vYXBpL2gyaCJ9.AxHi2wXqNJrDQa3RIbB1QXcA5MIzWZbDiyrr2GMtjmU';
        const WATA_API_URL = 'https://api.wata.pro/api/h2h';
        
        async function testWataAPI() {
            const result = document.getElementById('wataResult');
            result.innerHTML = '<p>Тестируем API...</p>';
            
            try {
                // Попробуем разные endpoints
                const endpoints = [
                    '/payments',
                    '/invoices',
                    '/balance'
                ];
                
                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(`${WATA_API_URL}${endpoint}`, {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${WATA_API_KEY}`,
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        result.innerHTML += `<p>Endpoint ${endpoint}: ${response.status} ${response.statusText}</p>`;
                        
                        if (response.ok || response.status === 405) {
                            const text = await response.text();
                            if (text) {
                                try {
                                    const data = JSON.parse(text);
                                    result.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                                } catch {
                                    result.innerHTML += `<pre>${text}</pre>`;
                                }
                            }
                        }
                    } catch (error) {
                        result.innerHTML += `<p class="error">Endpoint ${endpoint}: ${error.message}</p>`;
                    }
                }
            } catch (error) {
                result.innerHTML = `<p class="error">Ошибка: ${error.message}</p>`;
            }
        }
        
        async function createTestPayment() {
            const result = document.getElementById('paymentResult');
            result.innerHTML = '<p>Создаем тестовый платеж...</p>';
            
            const testPayment = {
                type: 'OneTime',
                amount: 100.00,
                currency: 'RUB',
                description: 'Test payment',
                orderId: 'test_' + Date.now(),
                successRedirectUrl: window.location.origin + '/success.html',
                failRedirectUrl: window.location.origin + '/payment.html'
            };
            
            try {
                console.log('Отправляем запрос:', testPayment);
                
                const response = await fetch(`${WATA_API_URL}/links`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${WATA_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testPayment)
                });
                
                result.innerHTML += `<p>Статус: ${response.status} ${response.statusText}</p>`;
                
                const responseText = await response.text();
                result.innerHTML += `<p>Ответ:</p><pre>${responseText}</pre>`;
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        result.innerHTML += `<p class="success">✓ Платеж создан!</p>`;
                        if (data.url || data.paymentUrl) {
                            result.innerHTML += `<p>URL: <a href="${data.url || data.paymentUrl}" target="_blank">Открыть платежную страницу</a></p>`;
                        }
                        result.innerHTML += `<details><summary>Полный ответ</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`;
                    } catch {
                        result.innerHTML += `<p>Не удалось распарсить JSON</p>`;
                    }
                } else {
                    result.innerHTML += `<p class="error">Ошибка создания платежа</p>`;
                }
            } catch (error) {
                result.innerHTML += `<p class="error">Ошибка: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
