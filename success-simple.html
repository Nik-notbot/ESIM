<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешная оплата - eSIM Store</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .success-container {
            max-width: 600px;
            margin: 100px auto 50px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .success-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
        }
        
        .success-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-dark);
        }
        
        .success-message {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 40px;
        }
        
        .order-info {
            background: var(--bg-light);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .order-info h3 {
            margin-bottom: 20px;
            color: var(--text-dark);
        }
        
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--text-dark);
        }
        
        .contact-section {
            background: #f0f9ff;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #bfdbfe;
            margin-top: 30px;
        }
        
        .contact-section h3 {
            color: #1e40af;
            margin-bottom: 15px;
        }
        
        .contact-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            margin-top: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .contact-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.3);
        }
        
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            text-decoration: none;
            margin-top: 30px;
            transition: color 0.3s;
        }
        
        .home-link:hover {
            color: var(--primary-color);
        }
        
        .loading {
            padding: 60px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="success-container" id="mainContainer">
        <div class="loading">
            <div class="spinner"></div>
            <p>Проверяем оплату...</p>
        </div>
    </div>
    
    <script>
        // Получаем ID заказа из URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        
        function showContent() {
            const container = document.getElementById('mainContainer');
            
            // Получаем данные заказа из localStorage
            const orderData = localStorage.getItem(`order_${orderId}`);
            
            if (!orderData) {
                container.innerHTML = `
                    <div class="error-container">
                        <h2>Заказ не найден</h2>
                        <p>Информация о заказе не найдена. Возможно, ссылка устарела.</p>
                        <a href="/" class="home-link">Вернуться на главную</a>
                    </div>
                `;
                return;
            }
            
            const order = JSON.parse(orderData);
            
            container.innerHTML = `
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M20 6L9 17l-5-5" stroke="currentColor"/>
                    </svg>
                </div>
                
                <h1 class="success-title">Спасибо за покупку!</h1>
                <p class="success-message">Ваш заказ успешно оформлен</p>
                
                <div class="order-info">
                    <h3>Информация о заказе:</h3>
                    <div class="order-item">
                        <span>Номер заказа:</span>
                        <span style="font-family: monospace; font-size: 0.9em;">${orderId}</span>
                    </div>
                    <div class="order-item">
                        <span>Тариф:</span>
                        <span>${order.planName} (${order.planData} ГБ)</span>
                    </div>
                    <div class="order-item">
                        <span>Сумма:</span>
                        <span>${order.planPrice} ₽</span>
                    </div>
                    <div class="order-item">
                        <span>Email:</span>
                        <span>${order.customerEmail}</span>
                    </div>
                </div>
                
                <div class="contact-section">
                    <h3>Получите ваш QR-код для активации eSIM</h3>
                    <p>
                        Для получения QR-кода напишите нашему менеджеру в Telegram. 
                        Отправьте номер вашего заказа, и мы сразу вышлем QR-код.
                    </p>
                    <p style="margin-top: 15px;">
                        <strong>Номер заказа для отправки:</strong><br>
                        <code style="background: #e5e7eb; padding: 8px 12px; border-radius: 5px; font-size: 1.1em;">
                            ${orderId}
                        </code>
                    </p>
                    <a href="https://t.me/m/s3YBfElRZGRk" class="contact-button" target="_blank">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
                        </svg>
                        Написать в поддержку
                    </a>
                </div>
                
                <a href="/" class="home-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    На главную
                </a>
            `;
        }
        
        // Показываем контент после небольшой задержки
        setTimeout(showContent, 1500);
    </script>
</body>
</html>
