<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Оплата — ВсемСим</title>
    <link rel="icon" href="//heyesim.net/favicon.ico" type="image/x-icon">
    <link rel="icon" href="//heyesim.net/favicon-120x120.png" type="image/png" sizes="120x120">
    <link rel="apple-touch-icon" href="//heyesim.net/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html" class="logo">
                <span class="logo-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                        <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                        <line x1="12" y1="20" x2="12.01" y2="20"/>
                    </svg>
                </span>
                ВсемСим
            </a>
        </div>
        <div class="header-right">
            <nav class="nav-left">
                <a href="https://t.me/hey_store_bot" target="_blank" rel="noopener" class="nav-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
                    </svg>
                    <span>Поддержка</span>
                </a>
            </nav>
        </div>
    </header>

    <section class="payment-section">
        <a href="javascript:history.back()" class="payment-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            Вернуться к выбору тарифа
        </a>

        <div class="payment-card">
            <div class="payment-card-header">
                <h1>Оплата заказа</h1>
                <p id="paySubtitle"></p>
            </div>
            <div class="payment-card-body" id="payBody">
                <div class="payment-spinner"></div>
                <p class="payment-status">Создаём платёж...</p>
            </div>
            <div class="payment-trust">
                <p>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Безопасная оплата через WATA
                </p>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-links">
            <a href="https://t.me/hey_store_bot" target="_blank" rel="noopener">Поддержка</a>
            <a href="offer.pdf" target="_blank">Оферта</a>
            <a href="PDN.pdf" target="_blank">Политика конфиденциальности</a>
            <a href="privacy.pdf" target="_blank">Обработка ПДн</a>
        </div>
        <p>© 2025 ВсемСим. Все права защищены.</p>
    </footer>

    <script src="baserow-config.js?v=3"></script>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var tariff = params.get('tariff') || '';
            var price = parseFloat(params.get('price')) || 0;
            var email = params.get('email') || '';
            var description = params.get('description') || 'eSIM';
            var country = params.get('country') || 'finland';
            var body = document.getElementById('payBody');
            var tariffNames = { '1': '\u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439', '2': '\u041f\u043e\u043f\u0443\u043b\u044f\u0440\u043d\u044b\u0439', '3': '\u041f\u0440\u0435\u043c\u0438\u0443\u043c' };

            var subtitle = document.getElementById('paySubtitle');
            if (tariffNames[tariff] && price) {
                subtitle.textContent = tariffNames[tariff] + ' \u2014 ' + price.toLocaleString('ru-RU') + ' \u20BD';
            }

            var countryPages = { finland: 'finland.html', uk: 'uk.html', registration: 'registration.html' };
            var backPage = countryPages[country] || 'index.html';

            function showError(msg) {
                body.innerHTML = '<div class="pay-error">' + msg + '<br><a href="' + backPage + '">\u0412\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f</a></div>';
            }

            if (!price) {
                showError('\u041e\u0448\u0438\u0431\u043a\u0430 \u043d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438 \u043e\u043f\u043b\u0430\u0442\u044b.');
                return;
            }

            var baseUrl = window.location.origin + window.location.pathname.replace(/[^\/]*$/, '');
            var orderId = String(Date.now()) + String(Math.floor(Math.random() * 9000) + 1000);
            var successUrl = baseUrl + 'success.html?' + new URLSearchParams({
                country: country, tariff: tariff, email: email, paid: '1', order: orderId
            }).toString();
            var failUrl = baseUrl + backPage + '?error=payment';

            fetch('/api/create-payment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: price,
                    orderId: orderId,
                    description: description,
                    successRedirectUrl: successUrl,
                    failRedirectUrl: failUrl
                })
            })
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(data) {
                if (data && data.url) {
                    window.location.href = data.url;
                } else {
                    showError('\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u0441\u043e\u0437\u0434\u0430\u0442\u044c \u043f\u043b\u0430\u0442\u0451\u0436.');
                }
            })
            .catch(function(err) {
                showError('\u041e\u0448\u0438\u0431\u043a\u0430 \u043f\u0440\u0438 \u0441\u043e\u0437\u0434\u0430\u043d\u0438\u0438 \u043f\u043b\u0430\u0442\u0435\u0436\u0430. \u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0435\u0449\u0451 \u0440\u0430\u0437.');
            });
        })();
    </script>
</body>
</html>
