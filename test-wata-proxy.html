<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Wata API через прокси</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .success { color: green; }
        .error { color: red; }
        pre {
            background: #f0f0f0;
            padding: 15px;
            overflow-x: auto;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Тест Wata API через Netlify Functions</h1>
    
    <div class="info">
        <strong>Почему через прокси?</strong> Wata API блокирует прямые запросы из браузера по соображениям безопасности. 
        Мы используем серверную функцию Netlify как посредника.
    </div>
    
    <div class="test">
        <h2>1. Тест создания платежа через прокси</h2>
        <button onclick="testPaymentViaProxy()">Создать тестовый платеж (100₽)</button>
        <div id="proxyResult"></div>
    </div>
    
    <div class="test">
        <h2>2. Тест реального сценария</h2>
        <button onclick="testRealScenario()">Тест полного цикла покупки</button>
        <div id="scenarioResult"></div>
    </div>

    <script>
        async function testPaymentViaProxy() {
            const result = document.getElementById('proxyResult');
            result.innerHTML = '<p>Отправляем запрос через Netlify Function...</p>';
            
            const testPayment = {
                amount: 100.00,
                currency: 'RUB',
                description: 'Тестовый платеж eSIM',
                orderId: 'test_' + Date.now(),
                customerEmail: 'test@example.com',
                successUrl: window.location.origin + '/success-simple.html',
                failUrl: window.location.origin + '/payment.html?error=1'
            };
            
            try {
                console.log('Отправляем данные:', testPayment);
                
                const response = await fetch('/.netlify/functions/wata-proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testPayment)
                });
                
                result.innerHTML += `<p>Статус ответа: ${response.status} ${response.statusText}</p>`;
                
                const responseText = await response.text();
                console.log('Ответ:', responseText);
                
                if (response.ok) {
                    try {
                        const data = JSON.parse(responseText);
                        result.innerHTML += `<p class="success">✓ Успешно! Платеж создан</p>`;
                        
                        if (data.paymentUrl || data.url) {
                            result.innerHTML += `
                                <p><strong>URL для оплаты:</strong></p>
                                <p><a href="${data.paymentUrl || data.url}" target="_blank" style="word-break: break-all;">
                                    ${data.paymentUrl || data.url}
                                </a></p>
                            `;
                        }
                        
                        if (data.paymentId || data.id) {
                            result.innerHTML += `<p><strong>ID платежа:</strong> ${data.paymentId || data.id}</p>`;
                        }
                        
                        result.innerHTML += `<details><summary>Полный ответ от API</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`;
                        
                    } catch (e) {
                        result.innerHTML += `<p class="error">Ошибка парсинга JSON: ${e.message}</p>`;
                        result.innerHTML += `<pre>${responseText}</pre>`;
                    }
                } else {
                    result.innerHTML += `<p class="error">Ошибка: ${response.status}</p>`;
                    result.innerHTML += `<pre>${responseText}</pre>`;
                }
                
            } catch (error) {
                result.innerHTML += `<p class="error">Ошибка сети: ${error.message}</p>`;
                console.error('Error:', error);
            }
        }
        
        async function testRealScenario() {
            const result = document.getElementById('scenarioResult');
            result.innerHTML = '<p>Симулируем реальную покупку...</p>';
            
            // Имитируем данные реального заказа
            const orderId = `esim_${Date.now()}_test`;
            const orderData = {
                amount: 990.00,
                currency: 'RUB',
                description: 'eSIM Стандарт - 8 ГБ',
                orderId: orderId,
                customerEmail: 'real-test@example.com',
                successUrl: `${window.location.origin}/success-simple.html?order=${orderId}`,
                failUrl: `${window.location.origin}/payment.html?error=1`
            };
            
            try {
                result.innerHTML += '<p>1. Создаем заказ...</p>';
                
                // Сохраняем в localStorage как в реальном сценарии
                localStorage.setItem(`order_${orderId}`, JSON.stringify({
                    id: orderId,
                    planName: 'Стандарт',
                    planData: '8',
                    planPrice: '990',
                    customerEmail: orderData.customerEmail,
                    createdAt: new Date().toISOString(),
                    status: 'pending'
                }));
                
                result.innerHTML += '<p>2. Отправляем запрос на создание платежа...</p>';
                
                const response = await fetch('/.netlify/functions/wata-proxy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });
                
                if (response.ok) {
                    const payment = await response.json();
                    result.innerHTML += `<p class="success">✓ Платеж создан успешно!</p>`;
                    
                    // Обновляем заказ
                    const order = JSON.parse(localStorage.getItem(`order_${orderId}`));
                    order.paymentId = payment.paymentId || payment.id;
                    order.paymentUrl = payment.paymentUrl || payment.url;
                    order.status = 'processing';
                    localStorage.setItem(`order_${orderId}`, JSON.stringify(order));
                    
                    result.innerHTML += `
                        <div style="margin-top: 20px; padding: 20px; background: #e8f5e9; border-radius: 10px;">
                            <h3>Тест прошел успешно! ✅</h3>
                            <p>Платежная система Wata работает корректно.</p>
                            <p><strong>Что дальше:</strong></p>
                            <ol style="text-align: left;">
                                <li>Клиент переходит по ссылке для оплаты</li>
                                <li>После оплаты возвращается на страницу успеха</li>
                                <li>Получает инструкции для получения QR-кода</li>
                            </ol>
                            ${payment.paymentUrl || payment.url ? `
                                <p style="margin-top: 15px;">
                                    <a href="${payment.paymentUrl || payment.url}" 
                                       target="_blank" 
                                       style="display: inline-block; padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px;">
                                        Открыть страницу оплаты (тест)
                                    </a>
                                </p>
                            ` : ''}
                        </div>
                    `;
                    
                } else {
                    const errorText = await response.text();
                    result.innerHTML += `<p class="error">Ошибка создания платежа: ${response.status}</p>`;
                    result.innerHTML += `<pre>${errorText}</pre>`;
                }
                
            } catch (error) {
                result.innerHTML += `<p class="error">Ошибка: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
