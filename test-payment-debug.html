<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест оплаты - Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Тест системы оплаты eSIM Store</h1>
    
    <div class="test-section">
        <h2>1. Проверка подключения к Supabase</h2>
        <div id="supabase-status">Проверяем...</div>
    </div>
    
    <div class="test-section">
        <h2>2. Проверка Netlify Functions</h2>
        <div id="netlify-status">Проверяем...</div>
    </div>
    
    <div class="test-section">
        <h2>3. Тест создания заказа</h2>
        <button onclick="testCreateOrder()">Создать тестовый заказ</button>
        <div id="order-result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Тест формы оплаты</h2>
        <p><a href="payment.html?plan=1&name=Стандарт&data=8&price=100" target="_blank">Открыть страницу оплаты (Стандарт)</a></p>
        <p><a href="payment.html?plan=2&name=Премиум&data=25&price=100" target="_blank">Открыть страницу оплаты (Премиум)</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Конфигурация Supabase
        const SUPABASE_URL = 'https://wiwkergsvbgnrdslqkzg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd2tlcmdzdmJnbnJkc2xxa3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY5OTA5MjAsImV4cCI6MjA3MjU2NjkyMH0.PmWeSrWMRzlHlFJpwRjlSla3Ra6hWAoCNErMEdEWtEk';
        
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Проверка Supabase
        async function checkSupabase() {
            try {
                const { data, error } = await supabase
                    .from('esim_plans')
                    .select('*');
                    
                if (error) {
                    document.getElementById('supabase-status').innerHTML = 
                        `<span class="error">❌ Ошибка: ${error.message}</span>`;
                } else {
                    document.getElementById('supabase-status').innerHTML = 
                        `<span class="success">✅ Подключение успешно! Найдено тарифов: ${data.length}</span>`;
                }
            } catch (err) {
                document.getElementById('supabase-status').innerHTML = 
                    `<span class="error">❌ Критическая ошибка: ${err.message}</span>`;
            }
        }
        
        // Проверка Netlify Functions
        async function checkNetlify() {
            try {
                const response = await fetch('/.netlify/functions/wata-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ test: true })
                });
                
                if (response.ok) {
                    document.getElementById('netlify-status').innerHTML = 
                        `<span class="success">✅ Netlify Functions доступны</span>`;
                } else {
                    document.getElementById('netlify-status').innerHTML = 
                        `<span class="error">❌ Ошибка Netlify Functions: ${response.status}</span>`;
                }
            } catch (err) {
                document.getElementById('netlify-status').innerHTML = 
                    `<span class="error">❌ Netlify Functions недоступны: ${err.message}</span>`;
            }
        }
        
        // Тест создания заказа
        async function testCreateOrder() {
            try {
                const { data, error } = await supabase
                    .from('orders')
                    .insert({
                        plan_id: 1,
                        customer_email: 'test@example.com',
                        customer_phone: '+79991234567',
                        amount: 100,
                        status: 'pending'
                    })
                    .select()
                    .single();
                    
                if (error) {
                    document.getElementById('order-result').innerHTML = 
                        `<span class="error">❌ Ошибка создания заказа: ${error.message}</span>`;
                } else {
                    document.getElementById('order-result').innerHTML = 
                        `<span class="success">✅ Заказ создан успешно! ID: ${data.id}</span>`;
                }
            } catch (err) {
                document.getElementById('order-result').innerHTML = 
                    `<span class="error">❌ Критическая ошибка: ${err.message}</span>`;
            }
        }
        
        // Запуск проверок при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            checkSupabase();
            checkNetlify();
        });
    </script>
</body>
</html>
