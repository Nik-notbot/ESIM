<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешная оплата - eSIM Store</title>
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .success-container {
            max-width: 600px;
            margin: 100px auto 50px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .success-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
        }
        
        .success-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-dark);
        }
        
        .success-message {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 40px;
        }
        
        .qr-section {
            background: var(--bg-light);
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .qr-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-dark);
        }
        
        .qr-code-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .qr-code-container img {
            max-width: 300px;
            height: auto;
            display: block;
        }
        
        .instructions {
            margin-top: 40px;
            text-align: left;
            background: #f0f9ff;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #bfdbfe;
        }
        
        .instructions h3 {
            margin-bottom: 15px;
            color: #1e40af;
        }
        
        .instructions ol {
            margin-left: 20px;
            color: #3b82f6;
        }
        
        .instructions li {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .download-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            text-decoration: none;
            margin-top: 30px;
            transition: color 0.3s;
        }
        
        .home-link:hover {
            color: var(--primary-color);
        }
        
        .loading-container {
            padding: 60px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-container {
            padding: 40px;
            text-align: center;
        }
        
        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
        }
    </style>
</head>
<body>
    <div class="success-container" id="mainContainer">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
    </div>

    <script src="baserow-config.js"></script>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var country = params.get('country') || '';
            var tariff = params.get('tariff');
            var email = params.get('email') || '';
            var paid = params.get('paid') === '1';
            var orderId = params.get('order') || '';
            var container = document.getElementById('mainContainer');
            var config = window.BASEROW_CONFIG || {};

            var tariffNames = { 1: '\u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439', 2: '\u041f\u043e\u043f\u0443\u043b\u044f\u0440\u043d\u044b\u0439', 3: '\u041f\u0440\u0435\u043c\u0438\u0443\u043c' };
            var tariffNum = parseInt(tariff, 10) || 0;
            var tariffName = tariffNames[tariffNum] || '';
            var fallback = config.fallbackQR && config.fallbackQR[country] && config.fallbackQR[country][tariffNum];

            function toDirectUrl(url) {
                if (!url) return url;
                if (url.indexOf('i.ibb.co/') !== -1) return url;
                var m = url.match(/ibb\.co\/([A-Za-z0-9]+)/);
                if (m) return 'https://i.ibb.co/' + m[1] + '/qr.jpg';
                return url;
            }

            function render(qrUrl) {
                var qrBlock = '';
                if (qrUrl) {
                    var imgUrl = toDirectUrl(qrUrl);
                    qrBlock =
                        '<div class="qr-code-container">' +
                        '<img src="' + imgUrl + '" alt="QR eSIM" style="max-width:300px;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\';">' +
                        '<a href="' + qrUrl + '" target="_blank" rel="noopener" class="download-button" style="display:none;">\u041e\u0442\u043a\u0440\u044b\u0442\u044c QR-\u043a\u043e\u0434</a>' +
                        '</div>';
                }
                var orderLine = orderId ? '<p style="font-size:0.85rem;color:#9ca3af;margin-bottom:24px;">\u0417\u0430\u043a\u0430\u0437 ' + orderId + '</p>' : '';
                container.innerHTML =
                    '<div class="success-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3"/></svg></div>' +
                    '<h1 class="success-title">\u041e\u043f\u043b\u0430\u0442\u0430 \u043f\u0440\u043e\u0448\u043b\u0430 \u0443\u0441\u043f\u0435\u0448\u043d\u043e</h1>' +
                    orderLine +
                    '<p class="success-message">\u0412\u0430\u0448\u0430 eSIM \u0433\u043e\u0442\u043e\u0432\u0430 \u043a \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u044e</p>' +
                    '<div class="qr-section">' +
                    '<h2 class="qr-title">QR-\u043a\u043e\u0434 \u0434\u043b\u044f \u0430\u043a\u0442\u0438\u0432\u0430\u0446\u0438\u0438 eSIM' + (tariffName ? ' \u2014 ' + tariffName : '') + '</h2>' +
                    qrBlock +
                    '</div>' +
                    '<div class="instructions"><h3>\u041a\u0430\u043a \u0430\u043a\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u0442\u044c eSIM</h3><ol>' +
                    '<li>\u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 <strong>\u041d\u0430\u0441\u0442\u0440\u043e\u0439\u043a\u0438</strong> \u2192 <strong>\u0421\u043e\u0442\u043e\u0432\u0430\u044f \u0441\u0432\u044f\u0437\u044c</strong></li>' +
                    '<li>\u041d\u0430\u0436\u043c\u0438\u0442\u0435 <strong>\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c eSIM</strong></li>' +
                    '<li>\u0412\u044b\u0431\u0435\u0440\u0438\u0442\u0435 <strong>\u0418\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u0442\u044c QR-\u043a\u043e\u0434</strong> \u0438 \u043e\u0442\u0441\u043a\u0430\u043d\u0438\u0440\u0443\u0439\u0442\u0435 \u043a\u043e\u0434</li>' +
                    '</ol></div>' +
                    '<a href="index.html" class="home-link">\u2190 \u041d\u0430 \u0433\u043b\u0430\u0432\u043d\u0443\u044e</a>';
            }

            function showError(msg) {
                container.innerHTML =
                    '<div class="error-container">' +
                    '<div class="error-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2"/></svg></div>' +
                    '<h2 class="success-title">\u041e\u0448\u0438\u0431\u043a\u0430</h2>' +
                    '<p class="success-message">' + (msg || '\u041d\u0435\u0432\u0435\u0440\u043d\u0430\u044f \u0441\u0441\u044b\u043b\u043a\u0430.') + '</p>' +
                    '<a href="index.html" class="home-link">\u041d\u0430 \u0433\u043b\u0430\u0432\u043d\u0443\u044e</a></div>';
            }

            if (!tariff || !country) {
                showError('\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d \u0442\u0430\u0440\u0438\u0444 \u0438\u043b\u0438 \u0441\u0442\u0440\u0430\u043d\u0430.');
                return;
            }

            if (!paid) {
                showError('\u041e\u043f\u043b\u0430\u0442\u0430 \u043d\u0435 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0430. <a href="finland.html">\u0412\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u043a \u043e\u043f\u043b\u0430\u0442\u0435</a>');
                return;
            }

            function updateBaserow(rowId) {
                if (!rowId) return;
                var url = config.apiUrl + '/api/database/rows/table/' + config.tableIdFinland + '/' + rowId + '/?user_field_names=true';
                var body = {};
                body['\u041e\u043f\u043b\u0430\u0442\u0430'] = true;
                if (email) body['Email'] = email;
                if (orderId) body['ID \u043a\u043b\u0438\u0435\u043d\u0442\u0430'] = orderId;
                fetch(url, {
                    method: 'PATCH',
                    headers: { 'Authorization': 'Token ' + config.token, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                }).catch(function() {});
            }

            function loadFromBaserow() {
                var url = config.apiUrl + '/api/database/rows/table/' + config.tableIdFinland + '/?user_field_names=true&size=200';
                fetch(url, { headers: { 'Authorization': 'Token ' + config.token } })
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var rows = Array.isArray(data) ? data : (data && data.results ? data.results : []);
                        var row = null;
                        for (var i = 0; i < rows.length; i++) {
                            var r = rows[i];
                            if (String(r['\u0422\u0430\u0440\u0438\u0444']) === String(tariffNum) && !r['\u041e\u043f\u043b\u0430\u0442\u0430']) {
                                row = r;
                                break;
                            }
                        }
                        if (!row) {
                            showError('\u0415\u0421\u0418\u041c \u0434\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u0442\u0430\u0440\u0438\u0444\u0430 \u0437\u0430\u043a\u043e\u043d\u0447\u0438\u043b\u0438\u0441\u044c. \u0421\u0432\u044f\u0436\u0438\u0442\u0435\u0441\u044c \u0441 <a href="https://t.me/hey_store_bot">\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u043e\u0439</a>.');
                            return;
                        }
                        var qr = row['\u0421\u0441\u044b\u043b\u043a\u0430'] || fallback;
                        updateBaserow(row.id);
                        render(qr || '');
                    })
                    .catch(function() {
                        render(fallback || '');
                    });
            }

            if (config.token && config.tableIdFinland && country === 'finland') {
                loadFromBaserow();
                setTimeout(function() {
                    if (container.querySelector('.spinner')) render(fallback || '');
                }, 6000);
            } else {
                render(fallback || '');
            }
        })();
    </script>
</body>
</html>
