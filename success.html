<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Успешная оплата - eSIM Store</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .success-container {
            max-width: 600px;
            margin: 100px auto 50px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.5s ease-out;
        }
        
        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .success-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
        }
        
        .success-title {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--text-dark);
        }
        
        .success-message {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 40px;
        }
        
        .qr-section {
            background: var(--bg-light);
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .qr-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-dark);
        }
        
        .qr-code-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .qr-code-container img {
            max-width: 300px;
            height: auto;
            display: block;
        }
        
        .instructions {
            margin-top: 40px;
            text-align: left;
            background: #f0f9ff;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #bfdbfe;
        }
        
        .instructions h3 {
            margin-bottom: 8px;
            color: #1e40af;
            font-size: 1.15rem;
        }

        .instructions .prereqs {
            margin-bottom: 20px;
            padding-left: 0;
            list-style: none;
        }

        .instructions .prereqs li {
            position: relative;
            padding-left: 22px;
            margin-bottom: 6px;
            line-height: 1.5;
            color: #374151;
            font-size: 0.92rem;
        }

        .instructions .prereqs li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #10b981;
            font-weight: 700;
        }

        .instructions h4 {
            margin: 20px 0 10px;
            color: #1e40af;
            font-size: 1rem;
        }
        
        .instructions ol {
            margin-left: 20px;
            color: #374151;
        }
        
        .instructions li {
            margin-bottom: 8px;
            line-height: 1.6;
            font-size: 0.92rem;
        }

        .instructions .note {
            margin-top: 20px;
            padding: 14px 16px;
            background: #fefce8;
            border: 1px solid #fde68a;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #92400e;
        }

        .instructions .note strong {
            display: block;
            margin-bottom: 4px;
        }

        .instructions .tip {
            margin-top: 14px;
            padding: 14px 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #166534;
        }
        
        .download-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .download-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            text-decoration: none;
            margin-top: 30px;
            transition: color 0.3s;
        }
        
        .home-link:hover {
            color: var(--primary-color);
        }
        
        .loading-container {
            padding: 60px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-container {
            padding: 40px;
            text-align: center;
        }
        
        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 3;
        }
    </style>
</head>
<body>
    <div class="success-container" id="mainContainer">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
    </div>

    <script src="baserow-config.js?v=3"></script>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var country = params.get('country') || '';
            var tariff = params.get('tariff');
            var email = params.get('email') || '';
            var paid = params.get('paid') === '1';
            var orderId = params.get('order') || '';
            var container = document.getElementById('mainContainer');
            var config = window.BASEROW_CONFIG || {};

            var tariffNames = { 1: '\u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439', 2: '\u041f\u043e\u043f\u0443\u043b\u044f\u0440\u043d\u044b\u0439', 3: '\u041f\u0440\u0435\u043c\u0438\u0443\u043c' };
            var countryPages = { finland: 'finland.html', uk: 'uk.html', registration: 'registration.html' };
            var tariffNum = parseInt(tariff, 10) || 0;
            var tariffName = tariffNames[tariffNum] || '';
            var fallback = config.fallbackQR && config.fallbackQR[country] && config.fallbackQR[country][tariffNum];

            function toDirectUrl(url) {
                if (!url) return url;
                if (url.indexOf('i.ibb.co/') !== -1) return url;
                var m = url.match(/ibb\.co\/([A-Za-z0-9]+)/);
                if (m) return 'https://i.ibb.co/' + m[1] + '/qr.jpg';
                return url;
            }

            function render(qrUrl, pin, puk) {
                var qrBlock = '';
                if (qrUrl) {
                    var imgUrl = toDirectUrl(qrUrl);
                    qrBlock =
                        '<div class="qr-code-container">' +
                        '<img src="' + imgUrl + '" alt="QR eSIM" style="max-width:300px;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\';">' +
                        '<a href="' + qrUrl + '" target="_blank" rel="noopener" class="download-button" style="display:none;">\u041e\u0442\u043a\u0440\u044b\u0442\u044c QR-\u043a\u043e\u0434</a>' +
                        '</div>';
                }
                var pinPukBlock = '';
                if (pin || puk) {
                    pinPukBlock = '<div style="display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap;">';
                    if (pin) {
                        pinPukBlock += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 24px;text-align:center;">' +
                            '<span style="display:block;font-size:0.75rem;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">PIN</span>' +
                            '<span style="font-size:1.3rem;font-weight:700;color:#1e293b;letter-spacing:2px;">' + pin + '</span></div>';
                    }
                    if (puk) {
                        pinPukBlock += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 24px;text-align:center;">' +
                            '<span style="display:block;font-size:0.75rem;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">PUK</span>' +
                            '<span style="font-size:1.3rem;font-weight:700;color:#1e293b;letter-spacing:2px;">' + puk + '</span></div>';
                    }
                    pinPukBlock += '</div>';
                }
                var orderLine = orderId ? '<p style="font-size:0.85rem;color:#9ca3af;margin-bottom:24px;">\u0417\u0430\u043a\u0430\u0437 ' + orderId + '</p>' : '';
                container.innerHTML =
                    '<div class="success-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3"/></svg></div>' +
                    '<h1 class="success-title">\u041e\u043f\u043b\u0430\u0442\u0430 \u043f\u0440\u043e\u0448\u043b\u0430 \u0443\u0441\u043f\u0435\u0448\u043d\u043e</h1>' +
                    orderLine +
                    '<p class="success-message">\u0412\u0430\u0448\u0430 eSIM \u0433\u043e\u0442\u043e\u0432\u0430 \u043a \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u044e</p>' +
                    '<div class="qr-section">' +
                    '<h2 class="qr-title">QR-\u043a\u043e\u0434 \u0434\u043b\u044f \u0430\u043a\u0442\u0438\u0432\u0430\u0446\u0438\u0438 eSIM' + (tariffName ? ' \u2014 ' + tariffName : '') + '</h2>' +
                    qrBlock +
                    pinPukBlock +
                    '</div>' +
                    '<div class="instructions">' +
                    '<h3>Инструкция по установке eSIM</h3>' +
                    '<ul class="prereqs">' +
                    '<li>Ваш телефон поддерживает eSIM</li>' +
                    '<li>У вас есть стабильное подключение к Wi-Fi или мобильной сети</li>' +
                    '<li>Вы получили QR-код (он выше на этой странице)</li>' +
                    '</ul>' +
                    '<h4>Для iPhone (iOS 13 и выше)</h4>' +
                    '<ol>' +
                    '<li>Зайдите в <strong>Настройки</strong> → <strong>Сотовая связь</strong> → <strong>Добавить сотовый тариф</strong></li>' +
                    '<li>Наведите камеру на QR-код</li>' +
                    '<li>Дождитесь загрузки профиля и нажмите <strong>Добавить тариф</strong></li>' +
                    '<li>При необходимости — выберите, как использовать этот тариф (основной / дополнительный)</li>' +
                    '</ol>' +
                    '<h4>Для Android (Samsung, Pixel, Xiaomi и др.)</h4>' +
                    '<ol>' +
                    '<li>Зайдите в <strong>Настройки</strong> → <strong>Подключения</strong> → <strong>Мобильные сети</strong> → <strong>Добавить eSIM</strong><br><small style="color:#6b7280;">(или: Сеть → SIM-карты → Добавить мобильный тариф)</small></li>' +
                    '<li>Выберите <strong>Сканировать QR-код</strong></li>' +
                    '<li>Наведите камеру на QR-код</li>' +
                    '<li>Подтвердите установку профиля и дождитесь подключения</li>' +
                    '</ol>' +
                    '<div class="tip">Обязательно включите <strong>роуминг данных</strong> и <strong>вызовы по Wi-Fi</strong>, даже если вы находитесь в своей стране. Это не приведёт к дополнительным расходам, но необходимо для корректной работы сети.</div>' +
                    '<div class="note"><strong>Обратите внимание</strong>Если eSIM не подключается автоматически и вы не получаете СМС с кодом, попробуйте вручную переключиться между разными операторами (МТС, Билайн, Теле2). Дайте каждому оператору ~10 минут, чтобы проверить, появится ли сеть.</div>' +
                    '</div>' +
                    '<a href="index.html" class="home-link">\u2190 \u041d\u0430 \u0433\u043b\u0430\u0432\u043d\u0443\u044e</a>';
            }

            function showError(msg) {
                container.innerHTML =
                    '<div class="error-container">' +
                    '<div class="error-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2"/></svg></div>' +
                    '<h2 class="success-title">\u041e\u0448\u0438\u0431\u043a\u0430</h2>' +
                    '<p class="success-message">' + (msg || '\u041d\u0435\u0432\u0435\u0440\u043d\u0430\u044f \u0441\u0441\u044b\u043b\u043a\u0430.') + '</p>' +
                    '<a href="index.html" class="home-link">\u041d\u0430 \u0433\u043b\u0430\u0432\u043d\u0443\u044e</a></div>';
            }

            if (!tariff || !country) {
                showError('\u041d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d \u0442\u0430\u0440\u0438\u0444 \u0438\u043b\u0438 \u0441\u0442\u0440\u0430\u043d\u0430.');
                return;
            }

            if (!paid) {
                var backPage = countryPages[country] || 'index.html';
                showError('\u041e\u043f\u043b\u0430\u0442\u0430 \u043d\u0435 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u0430. <a href="' + backPage + '">\u0412\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u043a \u043e\u043f\u043b\u0430\u0442\u0435</a>');
                return;
            }

            function renderBotPage() {
                var orderBlock = orderId
                    ? '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:20px 28px;display:inline-block;margin-bottom:28px;">' +
                      '<span style="display:block;font-size:0.75rem;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">\u041d\u043e\u043c\u0435\u0440 \u0437\u0430\u043a\u0430\u0437\u0430</span>' +
                      '<span style="font-size:1.6rem;font-weight:700;color:#1e293b;letter-spacing:2px;">' + orderId + '</span></div>'
                    : '';
                container.innerHTML =
                    '<div class="success-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3"/></svg></div>' +
                    '<h1 class="success-title">\u041e\u043f\u043b\u0430\u0442\u0430 \u043f\u0440\u043e\u0448\u043b\u0430 \u0443\u0441\u043f\u0435\u0448\u043d\u043e</h1>' +
                    '<p class="success-message">\u0422\u0430\u0440\u0438\u0444 \u00ab\u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439\u00bb \u2014 \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u0432 \u0441\u0435\u0440\u0432\u0438\u0441\u0430\u0445</p>' +
                    orderBlock +
                    '<div class="qr-section" style="text-align:center;">' +
                    '<h2 class="qr-title" style="margin-bottom:16px;">\u041a\u0430\u043a \u043f\u043e\u043b\u0443\u0447\u0438\u0442\u044c eSIM</h2>' +
                    '<p style="font-size:1.05rem;color:#374151;line-height:1.7;margin-bottom:24px;">\u0414\u043b\u044f \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f eSIM \u043d\u0430\u043f\u0438\u0448\u0438\u0442\u0435 \u0432 \u0431\u043e\u0442<br><strong>@hey_store_bot</strong> \u0441\u0432\u043e\u0439 \u043d\u043e\u043c\u0435\u0440 \u0437\u0430\u043a\u0430\u0437\u0430</p>' +
                    '<a href="https://t.me/hey_store_bot" target="_blank" rel="noopener" class="download-button" style="display:inline-flex;background:#0ea5e9;">' +
                    '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>' +
                    '\u041d\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u0432 \u0431\u043e\u0442</a>' +
                    '</div>' +
                    '<a href="index.html" class="home-link">\u2190 \u041d\u0430 \u0433\u043b\u0430\u0432\u043d\u0443\u044e</a>';
            }

            if (country === 'registration' && tariffNum === 1) {
                fetch('/api/record-sale.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ country: country, tariff: tariffNum, email: email, orderId: orderId })
                }).catch(function() {});
                renderBotPage();
                return;
            }

            function claimEsim() {
                fetch('/api/claim-esim.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        country: country,
                        tariff: tariffNum,
                        email: email,
                        orderId: orderId
                    })
                })
                .then(function(r) {
                    if (r.status === 404) {
                        showError('\u0415\u0421\u0418\u041c \u0434\u043b\u044f \u044d\u0442\u043e\u0433\u043e \u0442\u0430\u0440\u0438\u0444\u0430 \u0437\u0430\u043a\u043e\u043d\u0447\u0438\u043b\u0438\u0441\u044c. \u0421\u0432\u044f\u0436\u0438\u0442\u0435\u0441\u044c \u0441 <a href="https://t.me/hey_store_bot">\u043f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u043e\u0439</a>.');
                        return null;
                    }
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    if (!data) return;
                    var qr = data.qr || fallback || '';
                    render(qr, data.pin || '', data.puk || '');
                })
                .catch(function() {
                    render(fallback || '', '', '');
                });
            }

            claimEsim();
            setTimeout(function() {
                if (container.querySelector('.spinner')) render(fallback || '', '', '');
            }, 8000);
        })();
    </script>
</body>
</html>
