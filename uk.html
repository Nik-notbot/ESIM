    <script>
        var planInputs = document.querySelectorAll('input[name="plan"]');
        var priceDisplay = document.getElementById('priceDisplay');
        var payButton = document.getElementById('payButton');

        planInputs.forEach(function(input) {
            input.addEventListener('change', function() {
                priceDisplay.textContent = this.dataset.price + ' \u20BD';
                updateButtonState();
            });
        });

        var planMeta = {
            'uk-7d':      { country: 'uk',           tariff: 1, desc: 'eSIM UK \u2014 \u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439' },
            'uk-30d':     { country: 'uk',           tariff: 2, desc: 'eSIM UK \u2014 \u041f\u043e\u043f\u0443\u043b\u044f\u0440\u043d\u044b\u0439' },
            'uk-30d-pro': { country: 'uk',           tariff: 3, desc: 'eSIM UK \u2014 \u041f\u0440\u0435\u043c\u0438\u0443\u043c' },
            'reg-std':    { country: 'registration', tariff: 1, desc: 'eSIM \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u2014 \u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439' },
            'reg-yr':     { country: 'registration', tariff: 2, desc: 'eSIM \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u2014 \u0413\u043e\u0434\u043e\u0432\u043e\u0439' }
        };

        var stockTravel = {};
        var stockReg = {};
        var alwaysAvailable = { 'reg-std': true, 'reg-yr': true };

        function getStock(planVal) {
            if (alwaysAvailable[planVal]) return 1;
            var m = planMeta[planVal];
            if (!m) return 0;
            return m.country === 'uk' ? (stockTravel[m.tariff] || 0) : (stockReg[m.tariff] || 0);
        }

        function updateButtonState() {
            var selected = document.querySelector('input[name="plan"]:checked');
            if (!selected) return;
            if (getStock(selected.value) <= 0) {
                payButton.disabled = true;
                payButton.textContent = '\u041d\u0435\u0442 \u0432 \u043d\u0430\u043b\u0438\u0447\u0438\u0438';
                payButton.style.opacity = '0.5';
            } else {
                payButton.disabled = false;
                payButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg> \u041e\u043f\u043b\u0430\u0442\u0438\u0442\u044c <span id="priceDisplay">' + selected.dataset.price + ' \u20BD</span>';
                payButton.style.opacity = '1';
                priceDisplay = document.getElementById('priceDisplay');
            }
        }

        function applyStockBadges() {
            var allPlans = document.querySelectorAll('input[name="plan"]');
            allPlans.forEach(function(card) {
                var s = getStock(card.value);
                var badge = card.closest('.plan-option').querySelector('.plan-card');
                var existing = badge.querySelector('.stock-badge');
                if (existing) existing.remove();
                var el = document.createElement('span');
                el.className = 'stock-badge';
                if (s > 0) {
                    el.style.color = '#10b981';
                    el.textContent = '\u2713 \u0415\u0441\u0442\u044c \u0432 \u043d\u0430\u043b\u0438\u0447\u0438\u0438';
                } else {
                    el.style.color = '#ef4444';
                    el.textContent = '\u2715 \u041d\u0435\u0442 \u0432 \u043d\u0430\u043b\u0438\u0447\u0438\u0438';
                    card.disabled = true;
                    badge.style.opacity = '0.5';
                }
                badge.appendChild(el);
            });
            updateButtonState();
        }

        function fetchStock(country) {
            return fetch('/api/check-stock.php?country=' + country)
                .then(function(r) { return r.json(); })
                .then(function(data) { return (data && data.stock) || {}; })
                .catch(function() { return {}; });
        }

        (function checkStock() {
            Promise.all([
                fetchStock('uk'),
                fetchStock('registration')
            ]).then(function(results) {
                stockTravel = results[0];
                stockReg = results[1];
                applyStockBadges();
            });
        })();

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var selectedPlan = document.querySelector('input[name="plan"]:checked');
            var email = document.getElementById('email').value;
            if (!selectedPlan || !email) return;

            var meta = planMeta[selectedPlan.value];
            if (!meta || getStock(selectedPlan.value) <= 0) {
                alert('\u042d\u0442\u043e\u0442 \u0442\u0430\u0440\u0438\u0444 \u0437\u0430\u043a\u043e\u043d\u0447\u0438\u043b\u0441\u044f. \u0412\u044b\u0431\u0435\u0440\u0438\u0442\u0435 \u0434\u0440\u0443\u0433\u043e\u0439.');
                return;
            }

            var price = selectedPlan.dataset.price;
            var params = new URLSearchParams({
                country: meta.country,
                tariff: String(meta.tariff),
                price: price,
                email: email,
                description: meta.desc || 'eSIM'
            });
            window.location.href = 'payment.html?' + params.toString();
        });

        if (new URLSearchParams(window.location.search).get('error') === 'payment') {
            var note = document.querySelector('.form-note');
            if (note) {
                note.textContent = '\u041e\u043f\u043b\u0430\u0442\u0430 \u043d\u0435 \u043f\u0440\u043e\u0448\u043b\u0430. \u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0435\u0449\u0451 \u0440\u0430\u0437.';
                note.style.color = '#ef4444';
            }
        }
    </script>
