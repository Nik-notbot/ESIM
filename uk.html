<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>eSIM Великобритания - HEY, eSIM!</title>
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <div class="logo-section">
                <img src="favicon.png" alt="HEY, eSIM!" class="logo-image">
                <a href="index.html" style="text-decoration: none;">
                    <h1>HEY, eSIM!</h1>
                    <p>Часть экосистемы HEY, STORE!</p>
                </a>
            </div>
        </div>
        <div class="header-right">
            <nav class="nav-left">
                <a href="https://t.me/hey_store_bot" target="_blank" class="nav-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path>
                    </svg>
                    <span>Поддержка</span>
                </a>
            </nav>
            <button class="theme-toggle nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>
                    <path d="m4.93 4.93 1.41 1.41"></path>
                    <path d="m17.66 17.66 1.41 1.41"></path>
                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>
                    <path d="m6.34 17.66-1.41 1.41"></path>
                    <path d="m19.07 4.93-1.41 1.41"></path>
                </svg>
            </button>
        </div>
    </header>

    <section class="service-page">
        <a href="index.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"/>
            </svg>
            Назад к странам
        </a>
        
        <div class="service-page-content">
            
            <div class="service-page-info">
                <h1>eSIM Великобритания</h1>
                <p class="service-page-description">
                    Мобильный интернет для путешествий по UK
                </p>
            </div>

            <form class="service-form" id="orderForm">
                <div class="plans-group">
                    <label>Для регистрации в сервисах</label>
                    <div class="plan-grid" style="grid-template-columns: repeat(2, 1fr);">
                        <label class="plan-option">
                            <input type="radio" name="plan" value="reg-std" data-price="2800" data-name="SMS и звонки" checked>
                            <div class="plan-card">
                                <span class="plan-badge">Стандартный</span>
                                <span class="plan-name">SMS и звонки</span>
                                <span class="plan-price">2 800 ₽</span>
                                <ul class="plan-features">
                                    <li>1 год обслуживания</li>
                                    <li>Для регистрации на сервисах</li>
                                </ul>
                            </div>
                        </label>
                        <label class="plan-option">
                            <input type="radio" name="plan" value="reg-yr" data-price="4000" data-name="Год обслуживания">
                            <div class="plan-card">
                                <span class="plan-badge go">Годовой</span>
                                <span class="plan-name">SMS и звонки</span>
                                <span class="plan-price">4 000 ₽</span>
                                <ul class="plan-features">
                                    <li>Европейский номер</li>
                                    <li>Приём SMS и звонков</li>
                                </ul>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="plans-group" style="margin-top: 40px;">
                    <label>Для путешествий</label>
                    <div class="plan-grid" style="grid-template-columns: repeat(3, 1fr);">
                        <label class="plan-option">
                            <input type="radio" name="plan" value="uk-7d" data-price="3200" data-name="12 ГБ (7 дней)">
                            <div class="plan-card">
                                <span class="plan-badge">Стандартный</span>
                                <span class="plan-name">12 ГБ</span>
                                <span class="plan-price">3 200 ₽</span>
                                <ul class="plan-features">
                                    <li>7 дней</li>
                                    <li>Интернет по всей UK</li>
                                </ul>
                            </div>
                        </label>

                        <label class="plan-option">
                            <input type="radio" name="plan" value="uk-30d" data-price="4500" data-name="44 ГБ (30 дней)">
                            <div class="plan-card">
                                <span class="plan-badge go">Популярный</span>
                                <span class="plan-name">44 ГБ</span>
                                <span class="plan-price">4 500 ₽</span>
                                <ul class="plan-features">
                                    <li>30 дней</li>
                                    <li>Интернет по всей UK</li>
                                </ul>
                            </div>
                        </label>

                        <label class="plan-option">
                            <input type="radio" name="plan" value="uk-30d-pro" data-price="5900" data-name="66 ГБ (30 дней)">
                            <div class="plan-card">
                                <span class="plan-badge pro">Премиум</span>
                                <span class="plan-name">66 ГБ</span>
                                <span class="plan-price">5 900 ₽</span>
                                <ul class="plan-features">
                                    <li>30 дней</li>
                                    <li>Интернет по всей UK</li>
                                </ul>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 32px;">
                    <label for="email">Email для получения eSIM</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <button type="submit" class="pay-button" id="payButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="14" x="2" y="5" rx="2"/>
                        <line x1="2" x2="22" y1="10" y2="10"/>
                    </svg>
                    Оплатить <span id="priceDisplay">2 800 ₽</span>
                </button>

                <p class="form-note">QR-код для активации придёт на указанный email</p>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-links">
            <a href="https://heystore.net" target="_blank">HEY, STORE!</a>
            <a href="https://t.me/hey_store_official" target="_blank">Telegram канал</a>
            <a href="https://t.me/hey_store_bot" target="_blank">Поддержка</a>
        </div>
        <p>© 2025 HEY, eSIM! Часть экосистемы HEY, STORE!</p>
    </footer>

    <script src="baserow-config.js?v=3"></script>
    <script>
        var planInputs = document.querySelectorAll('input[name="plan"]');
        var priceDisplay = document.getElementById('priceDisplay');
        var payButton = document.getElementById('payButton');

        planInputs.forEach(function(input) {
            input.addEventListener('change', function() {
                priceDisplay.textContent = this.dataset.price + ' \u20BD';
                updateButtonState();
            });
        });

        var planMeta = {
            'uk-7d':      { country: 'uk',           tariff: 1, desc: 'eSIM UK \u2014 \u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439' },
            'uk-30d':     { country: 'uk',           tariff: 2, desc: 'eSIM UK \u2014 \u041f\u043e\u043f\u0443\u043b\u044f\u0440\u043d\u044b\u0439' },
            'uk-30d-pro': { country: 'uk',           tariff: 3, desc: 'eSIM UK \u2014 \u041f\u0440\u0435\u043c\u0438\u0443\u043c' },
            'reg-std':    { country: 'registration', tariff: 1, desc: 'eSIM \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u2014 \u0421\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u044b\u0439' },
            'reg-yr':     { country: 'registration', tariff: 2, desc: 'eSIM \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044f \u2014 \u0413\u043e\u0434\u043e\u0432\u043e\u0439' }
        };

        var stockTravel = {};
        var stockReg = {};

        function getStock(planVal) {
            var m = planMeta[planVal];
            if (!m) return 0;
            return m.country === 'uk' ? (stockTravel[m.tariff] || 0) : (stockReg[m.tariff] || 0);
        }

        function updateButtonState() {
            var selected = document.querySelector('input[name="plan"]:checked');
            if (!selected) return;
            if (getStock(selected.value) <= 0) {
                payButton.disabled = true;
                payButton.textContent = '\u041d\u0435\u0442 \u0432 \u043d\u0430\u043b\u0438\u0447\u0438\u0438';
                payButton.style.opacity = '0.5';
            } else {
                payButton.disabled = false;
                payButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg> \u041e\u043f\u043b\u0430\u0442\u0438\u0442\u044c <span id="priceDisplay">' + selected.dataset.price + ' \u20BD</span>';
                payButton.style.opacity = '1';
                priceDisplay = document.getElementById('priceDisplay');
            }
        }

        function applyStockBadges() {
            var allPlans = document.querySelectorAll('input[name="plan"]');
            allPlans.forEach(function(card) {
                var s = getStock(card.value);
                var badge = card.closest('.plan-option').querySelector('.plan-card');
                var existing = badge.querySelector('.stock-badge');
                if (existing) existing.remove();
                var el = document.createElement('span');
                el.className = 'stock-badge';
                el.style.cssText = 'display:block;font-size:0.8rem;margin-top:8px;font-weight:600;';
                if (s > 0) {
                    el.style.color = '#10b981';
                    el.textContent = '\u0415\u0441\u0442\u044c \u0432 \u043d\u0430\u043b\u0438\u0447\u0438\u0438';
                } else {
                    el.style.color = '#ef4444';
                    el.textContent = '\u041d\u0435\u0442 \u0432 \u043d\u0430\u043b\u0438\u0447\u0438\u0438';
                    card.disabled = true;
                    badge.style.opacity = '0.5';
                }
                badge.appendChild(el);
            });
            updateButtonState();
        }

        function fetchStock(country) {
            return fetch('/api/check-stock.php?country=' + country)
                .then(function(r) { return r.json(); })
                .then(function(data) { return (data && data.stock) || {}; })
                .catch(function() { return {}; });
        }

        (function checkStock() {
            Promise.all([
                fetchStock('uk'),
                fetchStock('registration')
            ]).then(function(results) {
                stockTravel = results[0];
                stockReg = results[1];
                applyStockBadges();
            });
        })();

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var selectedPlan = document.querySelector('input[name="plan"]:checked');
            var email = document.getElementById('email').value;
            if (!selectedPlan || !email) return;

            var meta = planMeta[selectedPlan.value];
            if (!meta || getStock(selectedPlan.value) <= 0) {
                alert('\u042d\u0442\u043e\u0442 \u0442\u0430\u0440\u0438\u0444 \u0437\u0430\u043a\u043e\u043d\u0447\u0438\u043b\u0441\u044f. \u0412\u044b\u0431\u0435\u0440\u0438\u0442\u0435 \u0434\u0440\u0443\u0433\u043e\u0439.');
                return;
            }

            var price = selectedPlan.dataset.price;
            var params = new URLSearchParams({
                country: meta.country,
                tariff: String(meta.tariff),
                price: price,
                email: email,
                description: meta.desc || 'eSIM'
            });
            window.location.href = 'payment.html?' + params.toString();
        });

        if (new URLSearchParams(window.location.search).get('error') === 'payment') {
            var note = document.querySelector('.form-note');
            if (note) {
                note.textContent = '\u041e\u043f\u043b\u0430\u0442\u0430 \u043d\u0435 \u043f\u0440\u043e\u0448\u043b\u0430. \u041f\u043e\u043f\u0440\u043e\u0431\u0443\u0439\u0442\u0435 \u0435\u0449\u0451 \u0440\u0430\u0437.';
                note.style.color = '#ef4444';
            }
        }

        // Theme Toggle
        const themeToggle = document.querySelector('.theme-toggle');
        const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>`;
        const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>`;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.innerHTML = sunIcon;
        } else {
            themeToggle.innerHTML = moonIcon;
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.innerHTML = moonIcon;
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.innerHTML = sunIcon;
            }
        });
    </script>
</body>
</html>
