<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Supabase подключения</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Тест подключения к Supabase</h1>
    
    <div class="test-section">
        <h2>1. Проверка подключения</h2>
        <button onclick="testConnection()">Тестировать подключение</button>
        <div id="connectionResult"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Проверка таблиц</h2>
        <button onclick="testTables()">Проверить таблицы</button>
        <div id="tablesResult"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Тест создания заказа</h2>
        <button onclick="testCreateOrder()">Создать тестовый заказ</button>
        <div id="orderResult"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Проверка CORS</h2>
        <button onclick="testCORS()">Проверить CORS</button>
        <div id="corsResult"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://nwcleyhnbzxetcqtlim.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53Y2xleWhubmJ6eGV0Y3F0bGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDczODEzODUsImV4cCI6MjA2Mjk1NzM4NX0.3ss3IMHLlhipHY1u8610mCX6TBG4e3doZULjvoQ1Ijg';
        
        let supabase;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase клиент создан успешно');
        } catch (error) {
            console.error('Ошибка создания Supabase клиента:', error);
        }
        
        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.innerHTML = '<p>Проверяем...</p>';
            
            try {
                const { data, error } = await supabase
                    .from('esim_plans')
                    .select('count')
                    .limit(1);
                    
                if (error) {
                    resultDiv.innerHTML = `<p class="error">Ошибка: ${error.message}</p><pre>${JSON.stringify(error, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = '<p class="success">✓ Подключение успешно!</p>';
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">Ошибка подключения: ${err.message}</p>`;
            }
        }
        
        async function testTables() {
            const resultDiv = document.getElementById('tablesResult');
            resultDiv.innerHTML = '<p>Проверяем таблицы...</p>';
            
            try {
                // Проверяем тарифы
                const { data: plans, error: plansError } = await supabase
                    .from('esim_plans')
                    .select('*');
                    
                // Проверяем QR коды
                const { data: qrCodes, error: qrError } = await supabase
                    .from('qr_codes')
                    .select('*')
                    .eq('is_used', false)
                    .limit(5);
                    
                let html = '';
                
                if (plansError) {
                    html += `<p class="error">Ошибка таблицы esim_plans: ${plansError.message}</p>`;
                } else {
                    html += `<p class="success">✓ Таблица esim_plans: ${plans.length} тарифов</p>`;
                    html += `<pre>${JSON.stringify(plans, null, 2)}</pre>`;
                }
                
                if (qrError) {
                    html += `<p class="error">Ошибка таблицы qr_codes: ${qrError.message}</p>`;
                } else {
                    html += `<p class="success">✓ Таблица qr_codes: найдено ${qrCodes.length} доступных кодов</p>`;
                }
                
                resultDiv.innerHTML = html;
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">Ошибка: ${err.message}</p>`;
            }
        }
        
        async function testCreateOrder() {
            const resultDiv = document.getElementById('orderResult');
            resultDiv.innerHTML = '<p>Создаем тестовый заказ...</p>';
            
            try {
                const testOrder = {
                    plan_id: 1,
                    customer_email: 'test@example.com',
                    customer_phone: '+79991234567',
                    amount: 990,
                    status: 'pending'
                };
                
                console.log('Пытаемся создать заказ:', testOrder);
                
                const { data, error } = await supabase
                    .from('orders')
                    .insert(testOrder)
                    .select()
                    .single();
                    
                if (error) {
                    resultDiv.innerHTML = `<p class="error">Ошибка создания заказа: ${error.message}</p><pre>${JSON.stringify(error, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<p class="success">✓ Заказ создан успешно!</p><pre>${JSON.stringify(data, null, 2)}</pre>`;
                    
                    // Удаляем тестовый заказ
                    await supabase
                        .from('orders')
                        .delete()
                        .eq('id', data.id);
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">Ошибка: ${err.message}</p>`;
            }
        }
        
        async function testCORS() {
            const resultDiv = document.getElementById('corsResult');
            resultDiv.innerHTML = '<p>Проверяем CORS...</p>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (response.ok) {
                    resultDiv.innerHTML = '<p class="success">✓ CORS настроен правильно</p>';
                    resultDiv.innerHTML += `<p>Текущий origin: ${window.location.origin}</p>`;
                } else {
                    resultDiv.innerHTML = `<p class="error">Ошибка CORS: ${response.status} ${response.statusText}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p class="error">Ошибка CORS: ${err.message}</p>`;
                resultDiv.innerHTML += `<p>Убедитесь, что ваш домен добавлен в настройки Supabase</p>`;
            }
        }
    </script>
</body>
</html>
